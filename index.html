<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIME ATTACK — 90s Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#150d33;--pn:#241653;--ln:#f5f0ff;--cy:#2de2e6;--mg:#ff3d9a;--yl:#ffd23f;--gr:#3dff8b;--rd:#ff5252;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--nt:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px))}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ln);font:800 18px/1.4 'Nunito',system-ui,sans-serif;background-image:linear-gradient(transparent 55%,rgba(45,226,230,.14)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.2) 3px 4px);background-attachment:fixed}
.px{font-family:'Press Start 2P','Courier New',monospace;line-height:1.6}
.sm{font-size:11px}.c{text-align:center}
main{max-width:560px;margin:0 auto;padding:14px}
.box{background:var(--pn);box-shadow:inset 0 0 0 4px var(--ln);clip-path:var(--nt);padding:22px;margin-bottom:12px}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:8px;color:var(--yl)}
.bar{display:flex;gap:3px;margin:6px 0 14px}.bar i{flex:1;height:12px;background:#3b2a80}.bar i.on{background:var(--gr)}
.tm{height:10px;background:#3b2a80;margin-bottom:12px}.tm div{height:100%;width:100%;background:var(--yl)}
.pr{color:var(--yl);font-size:21px;margin:0 0 12px;text-align:center}
.vis{display:flex;justify-content:center;margin-bottom:16px}
.lcd{background:#06130f;color:var(--gr);font:26px/1 'Press Start 2P',monospace;padding:22px 26px;text-shadow:0 0 12px var(--gr);box-shadow:inset 0 0 0 4px #1f7a4a;font-size:clamp(28px,11vw,48px)}
.say{background:#fff4d6;color:#241653;font-size:24px;padding:16px 20px;text-align:center;box-shadow:inset 0 0 0 4px var(--mg)}
.opt{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:14px;border:0;background:#fff;color:#241653;font:800 19px/1.3 'Nunito',sans-serif;text-align:left;cursor:pointer;clip-path:var(--nt);box-shadow:inset 0 0 0 3px #241653,inset 0 -5px 0 rgba(36,22,83,.2)}
.opt:hover:not(:disabled){background:#fff2b3}.opt:disabled{cursor:default}
.opt .ltr{font:11px 'Press Start 2P',monospace;background:var(--mg);color:#fff;padding:8px}
.opt.ok{background:#b8ffd2}.opt.no{background:#ffc4c4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .opt{flex-direction:column;margin:0}
.btn{font:12px 'Press Start 2P',monospace;background:var(--yl);color:#241653;border:0;padding:16px 20px;cursor:pointer;clip-path:var(--nt);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);margin-top:8px}
.btn:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
h1{font-size:clamp(22px,8vw,36px);margin:8px 0 14px;color:var(--yl);text-shadow:3px 3px 0 var(--mg),6px 6px 0 var(--cy);text-align:center}
h2{font-size:15px;margin:0 0 14px}
.big{font-size:23px;margin:6px 0}.hint{background:#3b2a80;padding:10px;font-size:16px}
.ov{position:fixed;inset:0;z-index:9;background:rgba(10,5,30,.85);display:grid;place-items:center;padding:16px;overflow:auto}
.fbk{max-width:420px;width:100%;text-align:center;animation:pop .3s}.fbk.bad{animation:shake .4s}
.s{position:fixed;left:50%;top:40%;z-index:10;color:var(--yl);font-size:24px;pointer-events:none;animation:burst .9s ease-out forwards}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols>div{display:flex;flex-direction:column;gap:10px}
.mc,.mp{border:0;background:#fff;color:#241653;font:800 17px 'Nunito',sans-serif;padding:10px;cursor:pointer;clip-path:var(--nt);box-shadow:inset 0 0 0 3px #241653;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;justify-content:center}
.mc.sel{background:#fff2b3;box-shadow:inset 0 0 0 4px var(--mg)}.mp.no{background:#ffc4c4;animation:shake .4s}.mc.done,.mp.done{background:#b8ffd2;opacity:.6}
.blink{animation:bl 1s steps(2) infinite}.up{display:inline-block;animation:bounce 1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4) rotate(200deg);opacity:0}}
@keyframes bl{50%{opacity:0}}@keyframes bounce{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const HW=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven"];
const MW={5:"five",10:"ten",15:"fifteen",20:"twenty",25:"twenty-five",30:"thirty",35:"thirty-five",40:"forty",45:"forty-five",50:"fifty",55:"fifty-five"};
const nh=h=>((h-1+120)%12)+1,hw=h=>HW[nh(h)%12];
const dg=(h,m)=>`${hw(h)} ${m==0?"o’clock":m<10?"oh "+MW[m]:MW[m]}`;
const tr=(h,m)=>m==0?`${hw(h)} o’clock`:m==15?`quarter past ${hw(h)}`:m==45?`quarter to ${hw(h+1)}`:m==30?`half past ${hw(h)}`:m<30?`${MW[m]} past ${hw(h)}`:`${MW[60-m]} to ${hw(h+1)}`;
const ph=(s,h,m)=>s=="dig"?dg(h,m):tr(h,m);
const dstr=(h,m)=>`${nh(h)}:${String(m).padStart(2,"0")}`;
const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S,M,timer,cnt=[0,0,0,0],lastPos=-1;
function distract(H,M){
 const key=(h,m)=>nh(h)*100+m,seen=new Set([key(H,M)]),r=[],x=(60-M)%60;
 const c=[...sh([[H+1,M],[H-1,M],[H,x],[H+1,x],[H+2,M]]),...sh([[H,30],[H,15],[H,45],[H,5],[H,10],[H,0]])];
 for(const[h,m]of c){const k=key(h,m);if(!seen.has(k)){seen.add(k);r.push([nh(h),m])}if(r.length==3)break}
 return r}
function pickPos(){
 const mn=Math.min(...cnt);let c=[0,1,2,3].filter(i=>cnt[i]<=mn+1&&i!=lastPos);
 const p=c[Math.random()*c.length|0];cnt[p]++;lastPos=p;return p}
function clock(h,m,s,nums=1){
 const pt=(d,l)=>{const r=d*Math.PI/180;return[50+l*Math.sin(r),50-l*Math.cos(r)]};
 const hand=(d,l,w,c)=>{const[x,y]=pt(d,l);return`<line x1="50" y1="50" x2="${x}" y2="${y}" stroke="${c}" stroke-width="${w}" stroke-linecap="square"/>`};
 let t="";for(let i=0;i<12;i++){const q=i%3==0,[a,b]=pt(i*30,q?37:40),[c,d]=pt(i*30,44);t+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#241653" stroke-width="${q?3:2}"/>`}
 if(nums)t+=[["12",50,25],["3",75,53],["6",50,81],["9",25,53]].map(([n,x,y])=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="7" fill="#241653" style="font-family:'Press Start 2P',monospace">${n}</text>`).join("");
 return`<svg viewBox="0 0 100 100" width="${s}" style="max-width:100%;height:auto" shape-rendering="crispEdges" role="img" aria-label="Analog clock"><circle cx="50" cy="50" r="48" fill="#ff3d9a"/><circle cx="50" cy="50" r="44" fill="#fff4d6"/>${t}${hand((h%12)*30+m/2,22,5,"#241653")}${hand(m*6,34,3,"#ff3d9a")}<rect x="47" y="47" width="6" height="6" fill="#ffd23f"/></svg>`}
const lcd=(h,m)=>`<div class="lcd">${dstr(h,m)}</div>`;
function hint(s,h,m){
 const d=dstr(h,m);
 if(s=="dig")return m==0?"💡 Remember: “o’clock” means exactly on the hour.":`💡 Digital time: say the hour, then the minutes. ${d} → ${dg(h,m)}.`;
 return m==0?"💡 Remember: “o’clock” means exactly on the hour.":m==15?"💡 Remember: “quarter past” means 15 minutes after the hour.":m==30?"💡 Remember: “half past” means 30 minutes after the hour.":m==45?`💡 Remember: “quarter to” means 15 minutes before the next hour. ${d} → ${tr(h,m)}.`:m<30?`💡 With “past”, use the hour that just passed. ${d} → ${tr(h,m)}.`:`💡 With “to”, use the next hour. ${d} → ${tr(h,m)}.`}
function mk([h,m,mode,sys,mix]){
 const H=nh(h),phr=ph(sys,H,m),fill=mode=="fill",P=t=>fill?t:`It’s ${t}`;
 let vis,prompt,cor,wr,clk=0,cls="";
 if(mode=="t2c"||mode=="t2d"){
  const f=mode=="t2c"?([a,b])=>clock(a,b,130,0):([a,b])=>dstr(a,b);
  cor=f([H,m]);wr=distract(H,m).map(f);vis=`<div class="say">“${phr}”</div>`;
  prompt=mode=="t2c"?"Which clock shows this time?":"Choose the correct time.";clk=mode=="t2c";cls=clk?"":"px"
 }else{
  cor=P(phr);wr=distract(H,m).map(([a,b])=>P(mix&&Math.random()<.4?ph(sys=="tr"?"dig":"tr",a,b):ph(sys,a,b)));
  if(sys=="tr"&&m==30&&Math.random()<.5)wr[0]=P("half to "+hw(H));
  vis=mode=="c2t"||(fill&&sys=="tr")?clock(H,m,230):lcd(H,m);
  prompt=fill?"Complete: It’s ______.":mode=="c2t"?"What time is it?":"Choose the correct expression."}
 const pos=pickPos(),opts=[...wr];opts.splice(pos,0,cor);
 return{vis,prompt,opts,pos,clk,cls,ans:`It’s ${phr}.`,ds:dstr(H,m),hint:hint(sys,H,m)}}
const T=(a)=>a.map(([h,m,d,s,x])=>[h,m,d,s,x]);
const LV=[
{n:"DIGITAL TIME",tip:"Say the hour, then the minutes. 7:45 → seven forty-five.",q:[[9,0,"d2t","dig"],[2,30,"t2d","dig"],[7,45,"d2t","dig"],[7,5,"fill","dig"],[11,15,"t2d","dig"],[4,30,"d2t","dig"],[1,45,"fill","dig"],[6,0,"t2d","dig"]]},
{n:"READ THE CLOCK",tip:"Look at the clock. Use o’clock, half past, quarter past and quarter to.",q:[[2,30,"c2t","tr",1],[5,0,"c2t","tr"],[9,15,"t2c","tr"],[3,45,"c2t","tr",1],[10,30,"fill","tr"],[12,15,"t2c","tr"],[8,45,"c2t","tr",1],[6,0,"fill","tr"]]},
{n:"PAST",tip:"PAST means minutes after the hour. 3:10 → ten past three.",q:[[3,5,"c2t","tr"],[3,10,"d2t","tr"],[3,15,"c2t","tr"],[3,20,"fill","tr"],[6,25,"t2c","tr"],[3,30,"d2t","tr"],[9,20,"c2t","tr"],[10,5,"fill","tr"]]},
{n:"TO",tip:"TO means minutes before the next hour. 5:50 → ten to six.",q:[[5,35,"c2t","tr"],[5,40,"d2t","tr"],[5,45,"c2t","tr"],[5,50,"fill","tr"],[5,55,"t2c","tr"],[9,40,"d2t","tr"],[11,50,"t2d","tr"],[12,55,"c2t","tr"]]},
{n:"MIXED TIME",tip:"Digital, past and to. Read carefully!",q:[[7,0,"c2t","tr",1],[7,5,"t2c","tr"],[7,15,"fill","tr"],[7,30,"d2t","dig",1],[7,45,"t2c","tr"],[7,55,"c2t","tr",1],[1,20,"t2d","tr"],[4,35,"fill","tr"]]},
{n:"DRAG & DROP",tip:"Match each clock to the correct expression. Tap a clock, then tap the answer. Or drag it.",match:1},
{n:"TIME ATTACK",tip:"You have 10 seconds for each question. Stay calm and go!",timed:1}];
const nQ=l=>l.match?4:l.q.length;
function rq(){const ms=[0,5,10,15,20,25,30,35,40,45,50,55],md=["c2t","d2t","t2c","c2t","d2t","t2c"];
 return sh(md.map(d=>[1+Math.random()*12|0,ms[Math.random()*12|0],d,Math.random()<.35?"dig":"tr",1]))}
const show=h=>{app.innerHTML=h;scrollTo(0,0)};
function hud(){const l=LV[S.lv];
 return`<div class="hud px"><span>⭐ ${S.score} POINTS</span><span>LEVEL ${S.lv+1}</span></div><p class="px sm c" style="margin:0">${l.match?"4 PAIRS TO MATCH":`Question ${S.q+1} / ${nQ(l)}`}</p><div class="bar">${Array.from({length:nQ(l)},(_,i)=>`<i class="${i<S.q?"on":""}"></i>`).join("")}</div>`}
function title(){show(`<section class="box c"><div class="px" style="font-size:32px">🕹️</div><h1 class="px">TIME<br>ATTACK</h1><p class="px sm" style="color:var(--cy)">90s EDITION</p><p>Learn to tell the time in English.<br>7 levels · 50 challenges</p><button class="btn" onclick="start()">START GAME</button><p class="px sm blink" style="margin-top:18px">PRESS START</p></section>`)}
function start(){S={lv:0,q:0,score:0,correct:0,total:0,lvC:0,lvT:0,lvP:0};cnt=[0,0,0,0];lastPos=-1;intro()}
function intro(){
 const l=LV[S.lv];S.q=0;S.lvC=S.lvT=S.lvP=0;if(l.timed)l.q=rq();
 show(`<section class="box c"><p class="px sm" style="color:var(--cy)">LEVEL ${S.lv+1} / ${LV.length}</p><div class="bar">${LV.map((_,i)=>`<i class="${i<=S.lv?"on":""}"></i>`).join("")}</div><h1 class="px">${l.n}</h1><p>${l.tip}</p><button class="btn" onclick="${l.match?"matchLevel()":"showQ()"}">GO!</button></section>`)}
function showQ(){
 const l=LV[S.lv],q=S.cur=mk(l.q[S.q]);
 show(`${hud()}${l.timed?`<div class="tm"><div id="tb"></div></div>`:""}<section class="box"><p class="pr">${l.timed?"QUICK! ":""}${q.prompt}</p><div class="vis">${q.vis}</div><div class="${q.clk?"grid":""}">${q.opts.map((o,k)=>`<button class="opt ${q.cls}" onclick="pick(${k})"><b class="ltr">${"ABCD"[k]}</b><span>${o}</span></button>`).join("")}</div></section>`);
 if(l.timed){let t=100;timer=setInterval(()=>{t--;const b=$("#tb");if(b)b.style.width=t+"%";if(t<=0){clearInterval(timer);pick(-1)}},100)}}
function pick(k){
 clearInterval(timer);const q=S.cur,ok=k==q.pos;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j==q.pos)b.classList.add("ok");else if(j==k)b.classList.add("no")});
 S.total++;S.lvT++;if(ok){S.score+=100;S.correct++;S.lvC++;S.lvP+=100}
 fb(ok?"⭐ GREAT JOB!":k<0?"⏰ TIME’S UP!":"❌ NOT QUITE!",ok,ok?`<p class="big">${q.ans}</p><p class="px" style="color:var(--yl)">+100 POINTS</p>`:`<p>The correct answer is:</p><p class="big">${q.ans}</p><p>⏰ ${q.ds}</p><p class="hint">${q.hint}</p>`)}
function fb(t,ok,body){
 const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="fbk box ${ok?"":"bad"}"><h2 class="px" style="color:${ok?"var(--gr)":"var(--rd)"}">${t}</h2>${body}<button class="btn" onclick="adv()">CONTINUE →</button></div>`;
 document.body.append(o);if(ok)stars(14)}
function stars(n){for(let i=0;i<n;i++){const s=document.createElement("span"),a=Math.random()*6.28,d=90+Math.random()*130;s.className="s";s.textContent=i%3?"★":"🪙";s.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;document.body.append(s);setTimeout(()=>s.remove(),1000)}}
function adv(){$(".ov")?.remove();S.q++;S.q<nQ(LV[S.lv])?showQ():done()}
function done(){
 const n=nQ(LV[S.lv]),r=S.lvC/n,st=r>=.9?3:r>=.6?2:1,last=S.lv==LV.length-1;
 show(`<section class="box c"><div class="up" style="font-size:54px">🏆</div><h1 class="px">LEVEL<br>COMPLETE!</h1><p class="px" style="color:var(--yl);font-size:24px">${"★".repeat(st)}${"☆".repeat(3-st)}</p><p class="big">${S.lvC} / ${n} correct</p><p class="px sm">${S.lvP} POINTS</p><p class="px sm" style="color:var(--cy)">TOTAL: ${S.score}</p><button class="btn" onclick="${last?"final()":"S.lv++;intro()"}">${last?"FINISH":"NEXT LEVEL →"}</button></section>`)}
function final(){
 const a=S.correct/S.total;
 show(`<section class="box c"><div class="up" style="font-size:54px">🕹️</div><h1 class="px">TIME<br>MASTER!</h1><p class="px sm" style="line-height:2.4">QUESTIONS: ${S.total}<br>CORRECT: ${S.correct}<br>SCORE: ${S.score.toLocaleString("en-US")}<br>LEVELS: ${LV.length} / ${LV.length}</p><p class="big">${a>=.8?"You’ve mastered the clock!":"Great work! Play again to sharpen your clock skills."}</p><button class="btn" onclick="start()">PLAY AGAIN</button></section>`);stars(20)}
function matchLevel(){
 const P=[[4,15],[7,30],[8,45],[11,5]],L=sh([0,1,2,3]),R=sh([0,1,2,3]);
 M={done:new Set(),miss:new Set(),ok:0,P,sel:null};S.q=0;
 show(`${hud()}<section class="box"><p class="pr">Match the clock.</p><div class="cols"><div>${L.map(i=>`<button class="mc" draggable="true" data-i="${i}">${clock(P[i][0],P[i][1],110,0)}<span class="px sm">${dstr(...P[i])}</span></button>`).join("")}</div><div>${R.map(i=>`<button class="mp" data-i="${i}">${tr(...P[i])}</button>`).join("")}</div></div></section>`);
 app.querySelectorAll(".mc").forEach(b=>{b.onclick=()=>{if(M.done.has(+b.dataset.i))return;M.sel=+b.dataset.i;app.querySelectorAll(".mc").forEach(x=>x.classList.toggle("sel",x==b))};b.ondragstart=e=>{e.dataTransfer.setData("text",b.dataset.i);M.sel=+b.dataset.i}});
 app.querySelectorAll(".mp").forEach(b=>{b.onclick=()=>M.sel!=null&&tryM(M.sel,+b.dataset.i);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();tryM(+e.dataTransfer.getData("text"),+b.dataset.i)}})}
function tryM(a,b){
 if(M.done.has(a)||M.done.has(b))return;
 const ca=app.querySelector(`.mc[data-i="${a}"]`),pb=app.querySelector(`.mp[data-i="${b}"]`);
 if(a==b){M.done.add(a);if(!M.miss.has(a))M.ok++;[ca,pb].forEach(x=>{x.classList.add("done");x.classList.remove("sel");x.draggable=false});M.sel=null;stars(6);if(M.done.size==4)endM()}
 else{M.miss.add(a);pb.classList.add("no");setTimeout(()=>pb.classList.remove("no"),500)}}
function endM(){
 S.score+=M.ok*100;S.correct+=M.ok;S.total+=4;S.lvC=M.ok;S.lvP=M.ok*100;S.q=4;
 setTimeout(()=>fb(M.ok==4?"⭐ GREAT JOB!":"⭐ WELL DONE!",true,`<p class="px sm" style="line-height:2.2">${M.P.map(p=>`${dstr(...p)} → ${tr(...p)}`).join("<br>")}</p><p>${M.ok} / 4 on the first try</p><p class="px" style="color:var(--yl)">+${M.ok*100} POINTS</p><p class="hint">💡 PAST = after the hour. TO = before the next hour.</p>`),500)}
title();
</script>
</body>
</html>
